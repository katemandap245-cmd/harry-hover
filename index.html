<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html, body {
    margin: 0;
    padding: 0;
    background: transparent;
}

.card {
    position: relative;
    width: 500px;
    overflow: hidden;
}

.card img {
    display: block;
    width: 100%;
    height: auto;
}

.info {
    position: absolute;
    left: 0;
    bottom: 0;

    width: 100%;
    padding: 70px 20px 20px;

    color: white;

    opacity: 0;
    transform: translateY(20px);

    transition:
        opacity 0.4s ease,
        transform 0.4s ease;

    background: linear-gradient(
        to top,
        rgba(0,0,0,0.85),
        rgba(0,0,0,0)
    );
}

.card:hover .info {
    opacity: 1;
    transform: translateY(0);
}

.title {
    font-size: 24px;
    font-weight: bold;
}

.description {
    font-size: 15px;
    margin-top: 5px;
}

</style>

</head>

<body>

<div class="card">

    <img src="harry-potter.jpg">

    <div class="info">

        <div class="title">
            Harry Potter
        </div>

        <div class="description">
            The famous wizard and main character of the Harry Potter series.
        </div>

    </div>

</div>

</body>
</html>
